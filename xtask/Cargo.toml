[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
xoev-codelists = { path = "../crates/core" }
zstd = "0.13"
xrepository-rs = { git = "https://github.com/hd-gmbh-dev/xrepository-rs", features = ["reqwest"] }
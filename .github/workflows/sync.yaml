name: Sync codelists

# Keeps the bundle in step with XRepository. A scheduler (GitLab CI of the
# codelistdb service checks for new codelist versions there) can trigger this
# workflow through the API:
#
#   curl -X POST -H "Authorization: Bearer $TOKEN" \
#     -H "Accept: application/vnd.github+json" \
#     https://api.github.com/repos/hd-gmbh-dev/xoev-codelists-rs/actions/workflows/sync.yaml/dispatches \
#     -d '{"ref":"main"}'
#
# The workflow is a no-op unless a newer codelist version is published.

on:
  schedule:
    # Mondays, 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: sync-codelists
  cancel-in-progress: false

jobs:
  sync:
    name: Sync and release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@1.94.1

      - name: Check for new codelist versions
        id: freshness
        run: |
          set +e
          cargo run -q -p xtask -- check-freshness --json > freshness.json
          code=$?
          set -e
          cat freshness.json
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Sync all publishers and variants
        if: steps.freshness.outputs.code == '10'
        run: |
          for publisher in xwasser destatis xunternehmen dsmeld xauslaender bmi-bit; do
            for variant in full labels codes; do
              cargo run -q -p xtask -- sync --publisher "$publisher" --variant "$variant"
            done
          done
          cargo run -q -p xtask -- export --npm npm

      - name: Guard - a refresh may only change data
        if: steps.freshness.outputs.code == '10'
        run: |
          # If anything outside the bundles and the npm index changed, the
          # bundle format or the API moved - that is a manual major release.
          changed=$(git status --porcelain | awk '{print $2}' \
            | grep -v -E '^crates/[a-z-]+/data/[a-z-]+\.zst$|^npm/(index\.json|codelists/|labels/|codes/)' || true)
          if [ -n "$changed" ]; then
            echo "::error::non-data change detected, cut the release manually:"
            echo "$changed"
            exit 1
          fi

      - name: Verify the bundle
        if: steps.freshness.outputs.code == '10'
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo run -q -p xtask -- bundle-budget

      - name: Bump the version and tag the release
        if: steps.freshness.outputs.code == '10'
        run: |
          if git diff --quiet; then
            echo "nothing changed after the sync - no release"
            exit 0
          fi

          VERSION=$(cargo run -q -p xtask -- refresh-version --write)
          echo "next version: $VERSION"

          git config user.name "shapth bot"
          git config user.email "contact-oss@h-d-gmbh.de"
          git add -A
          git commit -m "chore: sync codelists ($(date -u +%F)) and release $VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"

      # The tag push triggers publish.yaml (crates.io + npm).
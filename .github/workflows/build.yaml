name: Build and test

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --no-deps -- -D warnings
      - name: Test (full bundles)
        run: cargo test
      - name: Test (label bundles)
        run: cargo test --no-default-features --features labels -p xoev-codelists-xwasser
      - name: Test (code-only bundles)
        run: cargo test --no-default-features --features codes -p xoev-codelists-xwasser
[package]
name = "xoev-codelists-xauslaender"
description = "Codelist data published under `urn:xoev-de:xauslaender:codeliste:` (XAuslaender)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["full"]
# full rows: labels, columns, validation
full = []
# key column plus the label column: enough for a dropdown, still all versions
labels = []
# codes only: just enough to validate a transmitted code (much smaller bundle)
codes = []

[dependencies]
xoev-codelists = { version = "=1.2610.0", path = "../core" }

[dev-dependencies]
serde_json = "1"

